events {
    worker_connections 1024;
}

http {
    upstream hybrid_backend {
        # Primary: Private Data Center Cluster
        server host.docker.internal:30081 max_fails=2 fail_timeout=3s;

        # Standby / Failover: Public Cloud Cluster
        server host.docker.internal:30082 backup;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://hybrid_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Fast failover timeouts
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;
            
            # Add header to show which backend served the traffic
            add_header X-Backend-Server $upstream_addr always;
            add_header X-Hybrid-Status "Active" always;
        }
    }
}
