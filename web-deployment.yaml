apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: visitor-counter-web
    tier: frontend
    env: public-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-counter-web
  template:
    metadata:
      labels:
        app: visitor-counter-web
        tier: frontend
        env: public-cloud
    spec:
      containers:
      - name: web
        image: visitor-counter:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: ENVIRONMENT
          value: "Public Cloud Cluster (AWS/GCP Simulation)"
        - name: CLUSTER_NAME
          value: "public-cloud-us-east-1"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
